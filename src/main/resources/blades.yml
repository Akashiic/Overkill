# Lâminas do servidor. A chave é livre; "id" é o modelo no resource pack (overkill:<id>, em kunftig/blades.json) e o
# que fica gravado no item.
#   item_base:    a espada do vanilla de que a lâmina é feita (WOOD_SWORD ... DIAMOND_SWORD). Segurar o botão direito
#                 com uma espada é o que carrega a Slash Art (como no SlashBlade).
#   dano_base:    o ataque da lâmina (o ATTACK_DAMAGE do SlashBlade: um golpe do combo multiplica isto).
#   durabilidade: golpes até a lâmina quebrar.
#   slash_art:    nenhuma, judgement_cut, drive_horizontal, drive_vertical, wave_edge, circle_slash, void_slash,
#                 sakura_end.
#   cor:          a cor dos efeitos (arco do corte, ondas, mira do lock-on), #RRGGBB.
laminas:
  aco:
    id: katana/aco
    nome: "&fKatana de Aço"
    item_base: GOLD_SWORD
    dano_base: 4
    durabilidade: 600
    slash_art: nenhuma
    cor: "#3333FF"
  serpente:
