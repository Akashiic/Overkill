name: Overkill
version: ${version}
main: com.akashic.overkill.bukkit.OverkillPlugin
description: Lâminas estilo SlashBlade e combate estilo hack'n'slash no 1.7.10, sobre o mod Kunftig.
authors: [Akashiic]
commands:
  overkill:
    description: Lâminas do Overkill (dar, pedra, ofuda, forja, info, recarregar).
    usage: /overkill
    aliases: [ok]
  forja:
    description: Abre a forja, onde as katanas são fortificadas e reparadas.
    usage: /forja
    aliases: [fortificar]
permissions:
  overkill.admin:
    description: Dar lâminas e materiais da forja e recarregar a configuração.
    default: op
  overkill.forja:
    description: Usar a forja.
    default: true
